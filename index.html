<!-- Add to Home Screen: Android and Chrome get the browser's own install
     prompt from the script below. iOS offers no prompt, so the button opens
     short Share menu steps instead. The block stays hidden once installed. -->
<div class="install" id="install" hidden>
  <button class="install-btn" id="install-btn" type="button">Add Northbrand to your home screen</button>
  <div class="install-help" id="install-help" hidden>
    <p id="install-help-ios" hidden>On your iPhone or iPad: tap the Share icon in Safari, scroll down, and choose <strong>Add to Home Screen</strong>. Northbrand lands on your home screen with its own icon, one tap from everything.</p>
    <p id="install-help-other" hidden>In your browser menu, choose <strong>Install app</strong> or <strong>Add to Home screen</strong>. Northbrand lands on your home screen with its own icon, one tap from everything.</p>

<script>
  // Card life: a warm highlight follows the pointer across each card,
  // and the card tilts gently toward it. The CSS reads --mx and --my
  // for the highlight and --rx and --ry for the tilt. Skipped entirely
  // for visitors who prefer reduced motion.
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('.card').forEach(function (card) {
      card.addEventListener('pointermove', function (e) {
        var r = card.getBoundingClientRect();
        var px = (e.clientX - r.left) / r.width;
        var py = (e.clientY - r.top) / r.height;
        card.style.setProperty('--mx', (px * 100) + '%');
        card.style.setProperty('--my', (py * 100) + '%');
        card.style.setProperty('--rx', ((px - 0.5) * 7).toFixed(2) + 'deg');
        card.style.setProperty('--ry', ((0.5 - py) * 7).toFixed(2) + 'deg');
      });
      card.addEventListener('pointerleave', function () {
        card.style.setProperty('--rx', '0deg');
        card.style.setProperty('--ry', '0deg');
      });
    });
  }
</script>

<script>
  // Add to Home Screen.
  // Android and Chrome: the browser offers its own install prompt, captured
  // here and fired by the button. iOS has no prompt, so the button shows the
  // Share menu steps instead. Once the hub is installed (running
  // standalone), the whole block stays hidden.
  (function () {
    var wrap = document.getElementById('install');
    var btn = document.getElementById('install-btn');
    var help = document.getElementById('install-help');
    var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (standalone) return;
    wrap.hidden = false;

    var deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
    });

    var isIOS = /iphone|ipad|ipod/i.test(window.navigator.userAgent);

    btn.addEventListener('click', function () {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () { deferredPrompt = null; });
        return;
      }
      document.getElementById(isIOS ? 'install-help-ios' : 'install-help-other').hidden = false;
      help.hidden = false;
    });

    window.addEventListener('appinstalled', function () { wrap.hidden = true; });

    // The service worker exists only so Chrome will offer the prompt.
    // It caches nothing (see sw.js), so visits always load the live page.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    }
  })();
</script>
